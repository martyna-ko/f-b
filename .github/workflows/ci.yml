# Continuous Integration: runs on every pull request and on every push to main.
# A pull request should only be merged when this workflow is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits are pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Typecheck, contrast, lint, CSS lint, formatting, build
        run: npm run check

      - name: Install test browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Component and accessibility tests (every Storybook story)
        run: npm run test

      - name: Build Storybook
        run: npm run build-storybook
